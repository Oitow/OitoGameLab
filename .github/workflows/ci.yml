name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/oito-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/oito-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke
        run: OITO_PLAYWRIGHT_MODULE="$RUNNER_TEMP/oito-browser/node_modules/playwright" node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore
