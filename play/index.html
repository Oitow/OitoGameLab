<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#163d43" />
    <link rel="icon" href="data:," />
    <title>OitoEngine · Spielplatz</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas
      id="scene"
      aria-label="Prozedurale Insel mit steuerbarem Charakter"
    ></canvas>
    <header>
      <div>
        <span class="eyebrow">OITO / ENGINE LAB</span
        ><strong id="objective">Welt entsteht …</strong>
      </div>
      <button id="pause" aria-pressed="false">Pause</button>
    </header>
    <details id="settings">
      <summary>Spiel & Welt</summary>
      <section>
        <label>Spielmodus<select id="game"></select></label>
        <form id="world">
          <label
            >Welt-Seed<input
              id="seed"
              type="number"
              min="0"
              max="4294967295"
              step="1"
              required /></label
          ><button>Erzeugen</button>
        </form>
        <label>Grafik<select id="quality"><option value="economy">Sparsam · 1×</option><option value="balanced" selected>Ausgewogen · 1,5×</option><option value="crisp">Scharf · 2×</option></select></label>
        <label>Kamera-Abstand<input id="camera-distance" type="range" min="0.65" max="1.8" step="0.05" value="1" /></label>
        <button id="random">Zufällige Welt</button>
        <div class="row">
          <button id="save">Speichern</button><button id="load">Laden</button>
        </div>
        <p id="stats"></p>
        <a href="../">Zum Game Lab</a>
      </section>
    </details>
    <p id="inventory" hidden></p>
    <p id="prompt"></p>
    <button id="interact" hidden aria-label="Interagieren">E · Aktion</button>
    <p id="message" role="status">Joystick / WASD · Springen</p>
    <div id="joystick" aria-label="Bewegungs-Joystick">
      <div id="knob"></div>
    </div>
    <button id="jump" aria-label="Springen">↟<small>SPRUNG</small></button>
    <div id="error" role="alert" hidden></div>
    <script type="module">
      import("./main.js").catch((error) => {
        const box = document.querySelector("#error");
        box.hidden = false;
        box.textContent =
          "Start fehlgeschlagen. Bitte Internetverbindung prüfen und neu laden. " +
          error.message;
      });
    </script>
  </body>
</html>
