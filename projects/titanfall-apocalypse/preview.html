<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Titan Apocalypse | v0.3 Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070a10;color:#fff;font:13px system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;pointer-events:none;text-shadow:0 2px 5px #000}#hud b{font-size:18px;letter-spacing:2px}#hp{margin-top:7px;width:170px;height:8px;background:#341b22;border:1px solid #999}#fill{width:100%;height:100%;background:#e65c6a}#hint{position:fixed;top:12px;right:12px;max-width:42%;text-align:right;color:#ddd}#stick{position:fixed;bottom:38px;left:22px;width:120px;height:120px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12}#nub{position:absolute;left:43px;top:43px;width:34px;height:34px;border-radius:50%;background:#ffffff99}#skills{position:fixed;bottom:35px;right:18px;display:flex;gap:8px;align-items:end}button{width:64px;height:64px;border-radius:50%;background:#252b42bb;border:2px solid #d2a2a2;color:white;font-weight:bold;touch-action:none}button:nth-child(3){width:82px;height:82px;border-color:#ff6973;background:#602936cc}#msg{position:fixed;top:35%;width:100%;text-align:center;font-size:22px;pointer-events:none;text-shadow:0 3px 8px black}#objective{position:fixed;top:76px;left:12px;color:#f1c1a8;text-shadow:0 2px 5px #000}#energy{position:fixed;top:53px;left:12px;width:170px;height:5px;background:#18364a}#energybar{height:100%;width:100%;background:#52c6f1}</style></head><body><div id="hud"><b>TITAN // APOCALYPSE</b><div id="hp"><div id="fill"></div></div><div id="stats">TITAN 100% · FPS --</div></div><div id="energy"><div id="energybar"></div></div><div id="objective">Reach the crimson beacon</div><div id="hint">WASD / Joystick · Drag camera · 1/2/3 spells</div><div id="stick"><div id="nub"></div></div><div id="skills"><button data-skill="0">BOLT</button><button data-skill="1">NOVA</button><button data-skill="2">ORBIT</button></div><div id="msg"></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {createAtmosphereWorld} from './world/atmosphere.js';
import {createDestructionSystem} from './combat/destruction.js';
import {createTitanBrain} from './titans/behavior.js';
import {createAbilityController} from './combat/abilities.js';
import {generateEncounterMap,zoneAt} from './world/encounters.js';
import {createSkillTree} from './progression/skill-tree.js';
const scene=new T.Scene();scene.background=new T.Color(0x151b29);scene.fog=new T.FogExp2(0x151b29,.003);
const camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,3500),renderer=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0x9db8ed,0x292017,1.8));const sun=new T.DirectionalLight(0xff9479,2.4);sun.position.set(-300,600,-500);scene.add(sun);
const mat=(c)=>new T.MeshLambertMaterial({color:c,flatShading:true});const ground=new T.Mesh(new T.PlaneGeometry(5000,5000),mat(0x343b3c));ground.rotation.x=-Math.PI/2;scene.add(ground);
const box=(w,h,d,m,x,y,z)=>{let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o};
const rubble=mat(0x5e6265),city=mat(0x4b5261),trim=mat(0x222a37),red=mat(0xb54454),glow=new T.MeshBasicMaterial({color:0xff596a}),blue=new T.MeshBasicMaterial({color:0x55d9ff});
const atmosphere=createAtmosphereWorld(T,scene,{quality:innerWidth<600?"low":"medium"});const destruction=createDestructionSystem(T,scene,{maxDebris:innerWidth<600?48:96});const brain=createTitanBrain({maxHealth:1000});const abilities=createAbilityController();const encounter=generateEncounterMap();const skills=createSkillTree();const buildings=[];let seed=42;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let x=-10;x<=10;x++)for(let z=-10;z<=10;z++){if(Math.abs(x)<2&&z>0&&z<7)continue;if(rand()<.24)continue;let h=20+rand()*110,w=15+rand()*15;let b=box(w,h,w,rand()<.3?trim:city,x*55,h/2,z*55);b.userData={hp:3,initial:h};buildings.push(b);destruction.register(b,70)}
for(let i=0;i<80;i++){let x=(rand()-.5)*1600,z=(rand()-.5)*1600;let h=70+rand()*230;let rock=new T.Mesh(new T.ConeGeometry(50+rand()*70,h,5),rubble);rock.position.set(x,h/2-10,z);scene.add(rock)}
const player=new T.Group();scene.add(player);const torso=box(1.5,2.5,.9,mat(0xced2c9),0,2,0);player.add(torso);scene.remove(torso);const head=new T.Mesh(new T.IcosahedronGeometry(.8,0),mat(0x2d3a49));head.position.y=4;player.add(head);player.position.set(0,0,280);
const titan=new T.Group();scene.add(titan);titan.position.set(0,0,-300);const shell=mat(0x252d37),armor=mat(0x545c6a);
function limb(w,h,d,m,x,y,z){let a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);titan.add(a);return a}
limb(45,110,32,shell,0,155,0);limb(35,55,34,armor,0,225,0);limb(25,35,30,shell,0,275,0);
for(const s of [-1,1]){limb(17,120,19,armor,s*18,55,0);limb(20,115,20,shell,s*42,155,0);limb(12,55,12,armor,s*43,76,0);let horn=new T.Mesh(new T.ConeGeometry(13,70,4),red);horn.position.set(s*12,310,0);titan.add(horn)}
for(let i=0;i<5;i++){let eye=new T.Mesh(new T.BoxGeometry(6,3,2),glow);eye.position.set((i-2)*7,277,16);titan.add(eye)}
const ring=new T.Mesh(new T.TorusGeometry(40,3,5,28),glow);ring.position.set(0,210,19);titan.add(ring);
let hp=100,charge=0,cool=[0,0,0],fx=[],keys={},joy={x:0,y:0},yaw=0,pitch=.24,drag=null,last=performance.now(),fps=60,attackTimer=0;
const stats=document.getElementById('stats'),msg=document.getElementById('msg');
function flash(t){msg.textContent=t;setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},1200)}
function burst(pos,r,color){let mesh=new T.Mesh(new T.SphereGeometry(1,12,8),new T.MeshBasicMaterial({color,transparent:true,opacity:.65,wireframe:true}));mesh.position.copy(pos);scene.add(mesh);fx.push({mesh,life:.7,max:.7,r})}
function damage(pos,r,power){for(let b of buildings){if(!b.visible)continue;let d=b.position.distanceTo(pos);if(d<r){b.userData.hp-=power;if(b.userData.hp<=0){b.scale.y=.12;b.position.y=b.userData.initial*.06;b.visible=false;burst(b.position.clone(),35,0xff8d50)}}}if(titan.position.distanceTo(pos)<r+35){hp=Math.max(0,hp-power*3);stats.textContent='TITAN '+Math.ceil(hp)+'% · FPS '+Math.round(fps);if(hp===0)flash('TITAN DEFEATED')}} 
const objective=document.getElementById('objective'),energybar=document.getElementById('energybar');
const mobs=[];const mobMaterial=mat(0x9a4747);
for(const e of encounter.enemies){const mesh=new T.Mesh(new T.ConeGeometry(e.archetype==='artillery'?5:3,8,5),mobMaterial);mesh.position.set(e.x,4,e.z);scene.add(mesh);mobs.push({mesh,health:50});}
let playerHealth=100,level=1,experience=0;
function damageEnemies(position,radius,damage){for(const e of mobs){if(e.health<=0)continue;if(e.mesh.position.distanceTo(position)<radius){e.health-=damage;if(e.health<=0){e.mesh.visible=false;experience+=15;if(experience>=level*45){experience=0;level++;flash('LEVEL '+level+' REACHED')}}}}}
function cast(i){
 const id=['lance','rupture','orbital'][i],result=abilities.cast(id,{origin:player.position,target:titan.position});
 if(!result.ok||brain.state==='dead')return;
 const target=titan.position.clone().add(new T.Vector3(0,130,0));
 if(i===0){burst(target,35,0x44dfff);brain.damage(36,true);damageEnemies(titan.position,45,36)}
 if(i===1){burst(player.position.clone(),130,0xffb25b);destruction.impact(player.position,130,100);damageEnemies(player.position,130,95);if(player.position.distanceTo(titan.position)<160)brain.damage(95)}
 if(i===2){burst(target,280,0xff5266);destruction.impact(titan.position,250,500);damageEnemies(titan.position,250,420);brain.damage(420,true);flash('HEAVENFALL')}
 hp=brain.health/10;
}
document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();cast(+b.dataset.skill)}));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if('123'.includes(e.key))cast(+e.key-1)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});function moveStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(x,y));joy.x=x/Math.max(45,l);joy.y=y/Math.max(45,l);nub.style.transform='translate('+joy.x*43+'px,'+joy.y*43+'px)'}
function resetStick(){stickId=null;joy.x=joy.y=0;nub.style.transform=''}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;yaw-=(e.clientX-drag.x)*.005;pitch=T.MathUtils.clamp(pitch+(e.clientY-drag.y)*.003,-.2,.75);drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;fps=fps*.94+(1/Math.max(dt,.001))*.06;abilities.update(dt);atmosphere.update(now/1000);destruction.update(dt);for(let i=0;i<3;i++)cool[i]=abilities.cooldowns[['lance','rupture','orbital'][i]];document.querySelectorAll('button').forEach((b,i)=>{b.style.opacity=cool[i]>.01?.45:1;b.textContent=cool[i]>.01?cool[i].toFixed(1):['BOLT','NOVA','ORBIT'][i]});
let dx=(keys.d?1:0)-(keys.a?1:0)+joy.x,dz=(keys.s?1:0)-(keys.w?1:0)+joy.y;let v=new T.Vector3(dx,0,dz);if(v.length()>1)v.normalize();v.applyAxisAngle(new T.Vector3(0,1,0),yaw);player.position.addScaledVector(v,dt*36);player.rotation.y=yaw;
let offset=new T.Vector3(0,13,28).applyAxisAngle(new T.Vector3(0,1,0),yaw);offset.y+=pitch*35;camera.position.lerp(player.position.clone().add(offset),Math.min(1,dt*6));camera.lookAt(player.position.x,8+pitch*15,player.position.z-10);
titan.rotation.y=Math.sin(now*.0002)*.12;
for(const event of brain.update(dt)){
 if(event.type==='telegraph'){flash('WARNING: '+event.attack.name.toUpperCase());burst(titan.position.clone(),event.attack.radius,0xff3344)}
 if(event.type==='strike'&&player.position.distanceTo(titan.position)<event.attack.radius){playerHealth=Math.max(0,playerHealth-35);flash(playerHealth?'HIT! '+playerHealth+' HP':'YOU HAVE FALLEN')}
 if(event.type==='phase')flash('TITAN PHASE '+event.phase);
 if(event.type==='death')flash('COLOSSUS DEFEATED');
}
const zone=zoneAt(encounter,player.position.x,player.position.z);
objective.textContent=(zone?zone.name:'The Ash Wastes')+' · LV '+level+' · HP '+playerHealth+' · '+mobs.filter(m=>m.health>0).length+' hostiles';
energybar.style.width=(abilities.energy/abilities.maxEnergy*100)+'%';
for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.life-=dt;f.mesh.scale.setScalar(f.r*(1-f.life/f.max));f.mesh.material.opacity=Math.max(0,f.life/f.max)*.6;if(f.life<=0){scene.remove(f.mesh);f.mesh.geometry.dispose();f.mesh.material.dispose();fx.splice(i,1)}}
stats.textContent='TITAN '+Math.ceil(hp)+'% · FPS '+Math.round(fps);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop);
</script></body></html>
