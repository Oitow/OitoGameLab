<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102f3b"><title>OitoEngine v0.1</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#91c6d7;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:12px 14px;color:#fff;text-shadow:0 2px 5px #0009;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}#hud strong{font-size:16px;display:block}#stats{font-size:12px;line-height:1.6}button{pointer-events:auto;color:white;border:1px solid #fff8;background:#123947b8;padding:9px 12px;border-radius:12px;font-weight:600}#joystick{position:fixed;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;border:2px solid #fff7;background:#fff3;touch-action:none}#knob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:#fffd;box-shadow:0 2px 8px #0003;pointer-events:none}#note{position:fixed;right:14px;bottom:calc(24px + env(safe-area-inset-bottom));font-size:11px;color:white;text-shadow:0 2px 4px #0009;text-align:right;pointer-events:none}#error{display:none;position:fixed;inset:15% 8% auto;background:#351b21;color:white;padding:18px;border-radius:12px;white-space:pre-wrap}

</head><body><div id="hud"><div><strong>OitoEngine v0.1</strong><div id="stats">Starte…</div></div><button id="regenerate">Neue Insel ↻</button></div><div id="joystick"><div id="knob"></div></div><div id="note">Joystick / WASD<br>Seed-basierte Welt</div><div id="error"></div><script type="module" src="./src/main.js"></script></body></html>
